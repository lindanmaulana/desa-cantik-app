services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pandawa-app:prod
    restart: always
    env_file:
      - .env
    volumes:
      - pandawa_uploads:/var/www/storage/app/public
    networks:
      - pandawa-network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www:ro
      - pandawa_uploads:/var/www/storage/app/public/:ro
    networks:
      - pandawa-network
    depends_on:
      - app

  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pandawa_mysql:/var/lib/mysql
    networks:
      - pandawa-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME}", "-p${DB_PASSWORD}"]
      timeout: 5s
      retries: 5

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: pandawa-app:prod
    restart: always
    env_file:
      - .env
    command: php artisan queue:work --queue=default --tries=3 --quiet
    networks:
      - pandawa-network
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

volumes:
  pandawa_mysql:
  pandawa_uploads:

networks:
  pandawa-network:
